# Критерии проверки требований. Идентификатор постоянный: критерий не удаляют,
# а помечают `withdrawn = true`. Формулировки наши, по названиям свойств из
# источников; с текстом стандартов они не сверены.
version = "2026-11-27"

# --- Свойства отдельного требования: ISO/IEC/IEEE 29148:2018, п. 5.2.5 ---

[[criterion]]
id = "REQ-NECESSARY"
scope = "requirement"
name = "Необходимость"
source = "ISO/IEC/IEEE 29148:2018, п. 5.2.5"
check = "Требование нужно: без него продукт не выполнит цель или ограничение; оно не повторяет другое требование."

[[criterion]]
id = "REQ-APPROPRIATE"
scope = "requirement"
name = "Уместность"
source = "ISO/IEC/IEEE 29148:2018, п. 5.2.5"
check = "Уровень детализации соответствует уровню документа; требование говорит, что должно быть, а не навязывает проектное решение без причины."

[[criterion]]
id = "REQ-UNAMBIGUOUS"
scope = "requirement"
name = "Однозначность"
source = "ISO/IEC/IEEE 29148:2018, п. 5.2.5"
check = "Формулировку можно понять только одним способом: нет размытых слов, неопределённых терминов, неясных границ, единиц и часовых поясов."

[[criterion]]
id = "REQ-COMPLETE"
scope = "requirement"
name = "Полнота"
source = "ISO/IEC/IEEE 29148:2018, п. 5.2.5"
check = "Требование описывает поведение целиком: условия, исполнителя, результат, граничные и ошибочные случаи; у числа есть границы, шаг и единица; сказано, что происходит, когда объектов несколько (несколько карт, счетов, устройств у одного клиента); нет отсылок к тому, что не определено."

[[criterion]]
id = "REQ-SINGULAR"
scope = "requirement"
name = "Атомарность"
source = "ISO/IEC/IEEE 29148:2018, п. 5.2.5"
check = "Требование задаёт одну возможность или одно ограничение; несколько независимых условий не склеены в одну фразу."

[[criterion]]
id = "REQ-FEASIBLE"
scope = "requirement"
name = "Выполнимость"
source = "ISO/IEC/IEEE 29148:2018, п. 5.2.5"
check = "Требование можно реализовать в описанной архитектуре и с описанными данными."

[[criterion]]
id = "REQ-VERIFIABLE"
scope = "requirement"
name = "Проверяемость"
source = "ISO/IEC/IEEE 29148:2018, п. 5.2.5"
check = "Можно написать тест с однозначным ожидаемым результатом: есть измеримые значения, условия измерения и критерий прохождения."

[[criterion]]
id = "REQ-CORRECT"
scope = "requirement"
name = "Корректность"
source = "ISO/IEC/IEEE 29148:2018, п. 5.2.5"
check = "Требование верно отражает потребность: нет фактических ошибок в значениях, кодах, методах, единицах и примерах."

[[criterion]]
id = "REQ-CONFORMING"
scope = "requirement"
name = "Соответствие шаблону"
source = "ISO/IEC/IEEE 29148:2018, п. 5.2.5"
check = "Требование записано по принятому в документе шаблону и в своём разделе."

# --- Свойства набора требований: ISO/IEC/IEEE 29148:2018, п. 5.2.6; IEEE Std 830-1998, п. 4.3 ---

[[criterion]]
id = "SET-COMPLETE"
scope = "set"
name = "Полнота набора"
source = "ISO/IEC/IEEE 29148:2018, п. 5.2.6; IEEE Std 830-1998, п. 4.3.3"
check = "Набор покрывает все нужные функции, данные, интерфейсы, ошибки и ограничения; нет пустых разделов и заглушек «уточнить позже»."

[[criterion]]
id = "SET-CONSISTENT"
scope = "set"
name = "Непротиворечивость"
source = "ISO/IEC/IEEE 29148:2018, п. 5.2.6; IEEE Std 830-1998, п. 4.3.4"
check = "Требования, примеры, тест-кейсы, схемы и части документа не противоречат друг другу; одно понятие названо одинаково и в одних единицах."

[[criterion]]
id = "SET-FEASIBLE"
scope = "set"
name = "Выполнимость набора"
source = "ISO/IEC/IEEE 29148:2018, п. 5.2.6"
check = "Набор целиком реализуем в описанных ограничениях: архитектура, интеграции и данные позволяют выполнить все требования одновременно."

[[criterion]]
id = "SET-COMPREHENSIBLE"
scope = "set"
name = "Понятность"
source = "ISO/IEC/IEEE 29148:2018, п. 5.2.6"
check = "Из набора ясно, что ждут от системы и как её части связаны; термины определены."

[[criterion]]
id = "SET-VALIDATABLE"
scope = "set"
name = "Подтверждаемость"
source = "ISO/IEC/IEEE 29148:2018, п. 5.2.6"
check = "Можно доказать, что выполнение набора даёт заявленную бизнес-цель; есть критерии приёмки."

[[criterion]]
id = "SET-RANKED"
scope = "set"
name = "Ранжирование"
source = "IEEE Std 830-1998, п. 4.3.5"
check = "У требований указаны важность или стабильность, чтобы понимать, что делать первым."

[[criterion]]
id = "SET-MODIFIABLE"
scope = "set"
name = "Изменяемость"
source = "IEEE Std 830-1998, п. 4.3.7"
check = "Документ версионирован, структурирован, требования не дублируются, поэтому изменение вносится в одном месте."

[[criterion]]
id = "SET-TRACEABLE"
scope = "set"
name = "Трассируемость"
source = "IEEE Std 830-1998, п. 4.3.8; ISO/IEC/IEEE 29148:2018, п. 5.2.6"
check = "У требований есть идентификаторы; связь цель → требование → тест-кейс и родительский → дочерний документ прослеживается."

# --- Чек-лист «Ревью требований» из шаблона ТЗ организаторов ---

[[criterion]]
id = "CHK-BUSINESS"
scope = "set"
name = "Покрытие бизнес-требования"
source = "Шаблон ТЗ организаторов, чек-лист «Ревью требований»"
check = "Техническое требование зафиксировано и покрывает бизнес-требование и цель."

[[criterion]]
id = "CHK-ROLLBACK"
scope = "set"
name = "Схема отката"
source = "Шаблон ТЗ организаторов, чек-лист «Ревью требований»"
check = "Описана схема отката решения, а если откат невозможен — способ скрыть функционал."

[[criterion]]
id = "CHK-DATA"
scope = "set"
name = "Модель данных"
source = "Шаблон ТЗ организаторов, чек-лист «Ревью требований»"
check = "Описаны модель данных или поток данных: сущности, типы, единицы, ключи, срок хранения."

[[criterion]]
id = "CHK-RISK"
scope = "set"
name = "Операционные риски"
source = "Шаблон ТЗ организаторов, чек-лист «Ревью требований»"
check = "Нет явных операционных рисков: повторная обработка, потеря событий, двойные уведомления, сбой смежной системы описаны."

[[criterion]]
id = "CHK-SECURITY"
scope = "set"
name = "Информационная безопасность"
source = "Шаблон ТЗ организаторов, чек-лист «Ревью требований»"
check = "Структура требований не несёт рисков информационной безопасности: авторизация, доступ к чужим данным, передача и хранение персональных и карточных данных, безопасные методы API."

[[criterion]]
id = "CHK-INTEGRATION"
scope = "set"
name = "Постановка интеграции"
source = "Шаблон ТЗ организаторов, чек-лист «Ревью требований»"
check = "Интеграционное взаимодействие поставлено чётко: методы, параметры, коды ответа, ошибки, идемпотентность, окружения; дочерние документы согласованы с родительским."

[[criterion]]
id = "CHK-PROCESS"
scope = "set"
name = "Схема процесса"
source = "Шаблон ТЗ организаторов, чек-лист «Ревью требований»"
check = "Есть схема полного бизнес-процесса и выделена реализуемая часть, включая ветки ошибок."

[[criterion]]
id = "CHK-APPROVALS"
scope = "set"
name = "Согласования и версия"
source = "Шаблон ТЗ организаторов, чек-лист «Ревью требований»"
check = "Документ версионирован, изменения, влияющие на другие системы, согласованы с ответственными, блок согласующих заполнен."
