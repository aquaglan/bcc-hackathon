# Вопросы, которые хороший ревьюер задаст автору: решения, которые за автора не примет ни
# агент, ни разработчик. Список составлен 26.11 вслепую: отдельный агент видел только spec.md —
# без ответов нашего агента и без прежнего списка — и упорядочил вопросы по важности. После
# этого убраны только ключевые слова, которые он сам назвал общими («повторн», «минут», «200»,
# «error», «get»). Ключевые слова не правятся по результатам прогонов. Человеком не сверено.
#
# Совпадение: вопрос агента указывает на строку из `lines` или его текст содержит одно из
# `keywords`. Один вопрос агента засчитывается не больше чем за один ожидаемый.

[[question]]
id = "Q01"
what = "Ф-3 ограничивает push одним на карту в месяц, а Ф-4 говорит, что после смены порога следующее достижение вызывает push независимо от истории: какое правило главнее и сколько push в месяц допустимо при смене порога?"
lines = [39, 40]
keywords = ["один push", "максимум", "независимо от истории"]

[[question]]
id = "Q02"
what = "Месяц считается по дате совершения покупки или по дате проведения: в критерии приёмки покупка от 31 января, проведённая 1 февраля, идёт в февраль, что противоречит Ф-2; какая дата верна?"
