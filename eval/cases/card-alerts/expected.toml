keywords = ["дате совершения", "дате проведения", "31 января", "на границе месяц"]

[[question]]
id = "Q03"
what = "Что происходит при возврате: если возврат опускает расходы ниже порога и затем они снова достигают его, нужен ли повторный push, и как учитывать возврат в уже закрытом месяце или после отправленного push?"
